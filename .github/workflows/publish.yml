name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version merged to main and approved for this release stage
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/test.yml
  publish:
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and verify the immutable npm artifact
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/release.tgz
          PACKAGE_RECEIPT: ${{ runner.temp }}/package-receipt.json
        run: node .github/scripts/verify-package.mjs
      - name: Publish and reconcile release records
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RECEIPT: ${{ runner.temp }}/package-receipt.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/publish.mjs
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-receipt.json
            ${{ runner.temp }}/package-receipt.json
          if-no-files-found: warn
