name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version merged to main and approved for this release stage
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/test.yml
    with:
      release: true
  package:
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-candidate-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidates
          merge-multiple: true
      - name: Download same-run pinned source inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-inputs-${{ github.sha }}
          path: native/build/deps/downloads
      - name: Stage all five workers and complete corresponding source
        run: python native/dependencies/package.py --root "$GITHUB_WORKSPACE" --artifacts "${{ runner.temp }}/native-candidates" --source-sha "$GITHUB_SHA"
      - run: npm ci
      - run: npm run build
      - name: Build and verify the immutable npm artifact
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/release-artifact/release.tgz
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
        run: |
          mkdir -p "${{ runner.temp }}/release-artifact"
          node .github/scripts/verify-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  qualify:
    name: Installed protection and external FFmpeg qualification (${{ matrix.target }})
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2022
            target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-validation-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-validation
      - name: Install external FFmpeg
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            command -v ffmpeg || brew install ffmpeg
          else
            choco install ffmpeg --no-progress --yes
          fi
          command -v ffmpeg
          ffmpeg -hide_banner -version
          ffmpeg_path="$(command -v ffmpeg)"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Chocolatey's shim may drop inherited CRT descriptors 3/4/5.
            choco_root="$(cygpath -u "${ChocolateyInstall:-C:/ProgramData/chocolatey}")"
            ffmpeg_path="$(find "$choco_root/lib/ffmpeg/tools" -type f -iname ffmpeg.exe -print -quit)"
            test -n "$ffmpeg_path"
            ffmpeg_path="$(cygpath -m "$ffmpeg_path")"
          fi
          echo "QUALIFICATION_FFMPEG=$ffmpeg_path" >> "$GITHUB_ENV"
      - name: Install exact tar and verify external codecs plus independent SRTP receiver
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          VALIDATION_DIR: ${{ runner.temp }}/native-validation
          QUALIFICATION_RECEIPT: ${{ runner.temp }}/${{ matrix.target }}.json
        run: >-
          node .github/scripts/native-qualification.mjs run
          --artifact-directory "$ARTIFACT_DIR" --validation "$VALIDATION_DIR"
          --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA"
          --receipt "$QUALIFICATION_RECEIPT" --ffmpeg "$QUALIFICATION_FFMPEG"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main'
    needs: [package, qualify]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # registry-url would create token-auth config and a NODE_AUTH_TOKEN placeholder.
      # npm publish selects the public registry explicitly and authenticates with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-qualification-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-qualifications
          merge-multiple: true
      - name: Bind all five target proofs to the publication artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          QUALIFICATIONS_DIR: ${{ runner.temp }}/native-qualifications
        run: >-
          node .github/scripts/native-qualification.mjs aggregate
          --artifact-directory "$ARTIFACT_DIR" --qualifications "$QUALIFICATIONS_DIR"
          --source-sha "$GITHUB_SHA"
      - name: Publish and reconcile release records
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
          PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/publish.mjs
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-receipt.json
            ${{ runner.temp }}/release-artifact/package-receipt.json
          if-no-files-found: warn
