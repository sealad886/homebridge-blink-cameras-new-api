name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version merged to main and approved for this release stage
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gates:
    uses: ./.github/workflows/test.yml
    with:
      release: true
  package:
    if: github.ref == 'refs/heads/main'
    needs: gates
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Build and verify the immutable npm artifact
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/release-artifact/release.tgz
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
        run: |
          mkdir -p "${{ runner.temp }}/release-artifact"
          node .github/scripts/verify-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  publish:
    if: github.ref == 'refs/heads/main'
    needs: package
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # registry-url would create token-auth config and a NODE_AUTH_TOKEN placeholder.
      # npm publish selects the public registry explicitly and authenticates with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - name: Publish and reconcile release records
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
          PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          RELEASE_VERSION: ${{ inputs.version }}
        run: node .github/scripts/publish.mjs
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-receipt.json
            ${{ runner.temp }}/release-artifact/package-receipt.json
          if-no-files-found: warn
