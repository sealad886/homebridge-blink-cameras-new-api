name: Build or publish npm package

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Build and qualify a candidate, or explicitly publish an approved main release
        required: true
        type: choice
        default: build-only
        options: [build-only, publish]
      version:
        description: Optional exact candidate version; publication requires the exact approved main version
        required: false
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  intent:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.intent.outputs.mode }}
      version: ${{ steps.intent.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Resolve read-only build or explicit publication intent
        id: intent
        env:
          RELEASE_MODE: ${{ inputs.mode }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { releaseIntent } from './.github/scripts/release-policy.mjs';
          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const intent = releaseIntent({ mode: process.env.RELEASE_MODE || undefined, ref: process.env.GITHUB_REF,
            requestedVersion: process.env.RELEASE_VERSION, manifestVersion: manifest.version });
          appendFileSync(process.env.GITHUB_OUTPUT, `mode=${intent.mode}\nversion=${intent.version}\n`);
          JS
  gates:
    needs: intent
    uses: ./.github/workflows/test.yml
    with:
      release: true
  package:
    needs: [intent, gates]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-candidate-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-candidates
          merge-multiple: true
      - name: Download same-run pinned source inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-source-inputs-${{ github.sha }}
          path: native/build/deps/downloads
      - name: Stage all five workers and complete corresponding source
        run: python native/dependencies/package.py --root "$GITHUB_WORKSPACE" --artifacts "${{ runner.temp }}/native-candidates" --source-sha "$GITHUB_SHA"
      - run: npm ci
      - run: npm run build
      - name: Build and verify the immutable npm artifact
        env:
          PACKAGE_OUTPUT: ${{ runner.temp }}/release-artifact/release.tgz
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
        run: |
          mkdir -p "${{ runner.temp }}/release-artifact"
          node .github/scripts/verify-package.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  qualify:
    name: Installed npm native qualification (${{ matrix.target }})
    needs: package
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: ubuntu-22.04-arm
            target: linux-arm64
          - runner: macos-15
            target: darwin-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: windows-2022
            target: win32-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-validation-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-validation
      - name: Install exact tar and prove actual codec and independent SRTP receiver
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          VALIDATION_DIR: ${{ runner.temp }}/native-validation
          QUALIFICATION_RECEIPT: ${{ runner.temp }}/${{ matrix.target }}.json
        run: >-
          node .github/scripts/native-qualification.mjs run
          --artifact-directory "$ARTIFACT_DIR" --validation "$VALIDATION_DIR"
          --source-root "$GITHUB_WORKSPACE" --source-sha "$GITHUB_SHA"
          --receipt "$QUALIFICATION_RECEIPT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-qualification-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 7
  complete:
    needs: [intent, package, qualify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # registry-url would create token-auth config and a NODE_AUTH_TOKEN placeholder.
      # npm publish selects the public registry explicitly and authenticates with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: native-qualification-*-${{ github.sha }}
          path: ${{ runner.temp }}/native-qualifications
          merge-multiple: true
      - name: Bind all five target proofs to the publication artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          QUALIFICATIONS_DIR: ${{ runner.temp }}/native-qualifications
        run: >-
          node .github/scripts/native-qualification.mjs aggregate
          --artifact-directory "$ARTIFACT_DIR" --qualifications "$QUALIFICATIONS_DIR"
          --source-sha "$GITHUB_SHA" --mode "${{ needs.intent.outputs.mode }}"
          --ref "$GITHUB_REF" --version "${{ needs.intent.outputs.version }}"
      - name: Preserve complete qualified candidate without publishing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
  publish:
    if: needs.intent.outputs.mode == 'publish' && github.ref == 'refs/heads/main'
    needs: [intent, complete]
    runs-on: ubuntu-24.04
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      # registry-url would create token-auth config and a NODE_AUTH_TOKEN placeholder.
      # npm publish selects the public registry explicitly and authenticates with OIDC.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-package-${{ github.run_id }}
          path: ${{ runner.temp }}/release-artifact
      - name: Publish and reconcile release records
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_RECEIPT: ${{ runner.temp }}/release-artifact/package-receipt.json
          PACKAGE_ARTIFACT_DIR: ${{ runner.temp }}/release-artifact
          RELEASE_MODE: ${{ needs.intent.outputs.mode }}
          RELEASE_VERSION: ${{ needs.intent.outputs.version }}
        run: node .github/scripts/publish.mjs
      - name: Preserve release receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-receipt-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            release-receipt.json
            ${{ runner.temp }}/release-artifact/package-receipt.json
          if-no-files-found: warn
