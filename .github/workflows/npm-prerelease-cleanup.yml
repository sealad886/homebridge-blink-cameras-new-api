name: Cleanup npm prerelease tags

on:
  workflow_dispatch:
    inputs:
      stable_version:
        description: Exact stable version whose post-release acceptance has passed
        required: true
        type: string
      dist_tags:
        description: Comma-separated prerelease tags to remove (alpha,beta,rc only)
        default: alpha,beta,rc
        required: true
        type: string

concurrency:
  group: npm-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # OIDC supports publication, not dist-tag maintenance. Supply a short-lived,
      # package-scoped maintenance token only when this optional workflow is needed.
      - name: Remove tags and verify retained versions
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_MAINTENANCE_TOKEN }}
          STABLE_VERSION: ${{ inputs.stable_version }}
          DIST_TAGS: ${{ inputs.dist_tags }}
        run: node .github/scripts/cleanup-tags.mjs
