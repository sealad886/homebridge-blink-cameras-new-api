name: Documentation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - README.md
      - CONTRIBUTING.md
      - package.json
      - docs/**
      - output/articles/**
      - output/documentation/**
      - tools/docs/**
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

# PRs cancel superseded validation; main publications finish in sequence.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Validate documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/docs/package-lock.json
          package-manager-cache: false
      - name: Install isolated documentation tools
        run: npm ci --prefix tools/docs --ignore-scripts
      - name: Test the renderer contracts
        run: npm --prefix tools/docs test
      - name: Build the public site
        run: npm --prefix tools/docs run build
      - name: Check all published pages, links and assets
        run: npm --prefix tools/docs run check
      - name: Name the validated artifact
        id: artifact
        run: echo "name=docs-site-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Upload the validated site only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: .local/docs-site
          retention-days: 1

  deploy:
    name: Publish canonical documentation
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Admit only the current main revision
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'current=false' >> "$GITHUB_OUTPUT"
            echo 'Skipping publication because this run has been superseded on main.'
          fi
      - name: Check the existing Pages configuration
        if: steps.current.outputs.current == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false
      - name: Deploy the validated artifact
        id: deployment
        if: steps.current.outputs.current == 'true'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
      - name: Verify the published source revision and entry point
        if: steps.current.outputs.current == 'true'
        env:
          DOCS_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          verified=false
          for attempt in $(seq 1 12); do
            if curl --fail --show-error --silent --location \
              --connect-timeout 5 --max-time 10 \
              --header 'Cache-Control: no-cache' \
              --output "$RUNNER_TEMP/docs-build.json" \
              "${DOCS_URL%/}/build.json?revision=$GITHUB_SHA&attempt=$GITHUB_RUN_ATTEMPT-$attempt" \
              && jq --exit-status --arg revision "$GITHUB_SHA" \
                '.sourceRevision == $revision' "$RUNNER_TEMP/docs-build.json" >/dev/null; then
              verified=true
              break
            fi
            sleep 5
          done
          if [ "$verified" != true ]; then
            echo 'The expected documentation revision did not become public.' >&2
            exit 1
          fi
          curl --fail --show-error --silent --location \
            --connect-timeout 5 --max-time 10 \
            --retry 3 --retry-all-errors --retry-delay 3 --retry-max-time 30 \
            --output "$RUNNER_TEMP/docs-index.html" "$DOCS_URL"
          test -s "$RUNNER_TEMP/docs-index.html"
